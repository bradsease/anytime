[package]
name = "anytime"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
authors = ["Brad Sease <contact@bradsease.com>"]
description = "Ergonomic astronomical timescales in rust"
license = "MIT"
repository = "https://github.com/bradsease/anytime"
homepage = "https://github.com/bradsease/anytime"
documentation = "https://docs.rs/anytime"
readme = "README.md"
keywords = ["astronomy", "time", "timescales", "utc", "tai"]
categories = ["date-and-time", "science"]

[features]
serde = ["dep:serde", "chrono/serde"]

[dependencies]
chrono = { version = ">=0.4.34, <0.5", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"

[[bench]]
name = "scale_conversions"
harness = false
